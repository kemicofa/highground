# Called once per addon by ci.yml. Shared tests and publication live there.
name: Addon

on:
  workflow_call:
    inputs:
      addon:
        description: Folder name in addons/
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-luajit
      - name: Test the addon
        env:
          ADDON: ${{ inputs.addon }}
        run: bash tests/run.sh --addons-only "$ADDON"
      - name: Build the ZIP and release notes
        id: package
        env:
          ADDON: ${{ inputs.addon }}
        run: python3 scripts/build.py "$ADDON" --github-output "$GITHUB_OUTPUT"
      - name: Upload tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
