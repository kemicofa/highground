name: CI and release

on:
  pull_request:
    branches: [main]
    # Start checks when ready; cancel in-flight checks when returning to draft.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.classify.outputs.run_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0 # compare the complete PR against its merge base
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 scripts/ci_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          fi

  docs:
    # Documentation-only PRs skip the test jobs; these checks need no LuaJIT.
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.run_tests == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links, guide indexes and Markdown line limits
        run: python3 -m unittest tests/test_links.py tests/test_docs.py

  checks:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-luajit
      - name: Test packaging, release and cross-addon integration
        run: bash tests/run.sh --repository-only
      - name: Validate and preview the Discord announcement
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/discord_release.py --repository "$RELEASE_REPOSITORY" --check

  addons:
    name: ${{ matrix.addon }}
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Deprecated hosts still exercise shared feature code, but are not packaged.
        addon:
          - Highground
          - HighgroundArena
          - HighgroundBattlegrounds
          - HighgroundBounties
          - HighgroundMacros
          - HighgroundNearby
          - HighgroundReputation
    uses: ./.github/workflows/addon.yml
    with:
      addon: ${{ matrix.addon }}

  ci:
    # Keep this name stable: main requires this aggregate check.
    name: CI
    needs: [changes, checks, addons, docs]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require every check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_RESULT: ${{ needs.checks.result }}
          ADDON_RESULT: ${{ needs.addons.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request && "$RUN_TESTS" == false && "$REPOSITORY_RESULT" == skipped && "$ADDON_RESULT" == skipped ]]; then
            if [[ "$DOCS_RESULT" != success ]]; then
              echo "::error::Documentation checks: $DOCS_RESULT"
              exit 1
            fi
            echo 'Documentation-only PR: tests intentionally skipped; documentation checks passed.'
            exit 0
          fi
          if [[ "$RUN_TESTS" != true ]]; then
            echo "::error::Unexpected test decision: $RUN_TESTS"
            exit 1
          fi
          if [[ "$REPOSITORY_RESULT" != success || "$ADDON_RESULT" != success ]]; then
            echo "::error::Repository checks: $REPOSITORY_RESULT; addon tests and Highground package: $ADDON_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          persist-credentials: false
          fetch-depth: 0 # release tags and history, fetched once for the whole batch
      - name: Plan publication
        id: plan
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/release_plan.py --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.addon }}
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.ci.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - name: Publish the tested package
        env:
          ADDON: ${{ matrix.addon }}
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish.py "$ADDON" --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"

  announce:
    name: Announce release
    needs: [ci, publish]
    # Still runs when no uploads are due, so an interrupted announcement can retry.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.ci.result == 'success' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Announce the completed release on Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${{ vars.DISCORD_ANNOUNCEMENTS_CHANNEL_ID }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/discord_release.py --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
