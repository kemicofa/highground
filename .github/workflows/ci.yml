name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-luajit
      - name: Test packaging, release and cross-addon integration
        run: bash tests/run.sh --repository-only
      - name: Validate and preview the Discord announcement
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/discord_release.py --repository "$RELEASE_REPOSITORY" --check

  addons:
    name: ${{ matrix.addon }}
    strategy:
      fail-fast: false
      matrix:
        addon:
          - Highground
          - HighgroundArena
          - HighgroundBattlegrounds
          - HighgroundBounties
          - HighgroundMacros
          - HighgroundNearby
    uses: ./.github/workflows/addon.yml
    with:
      addon: ${{ matrix.addon }}

  ci:
    # Keep this name stable: main requires this aggregate check.
    name: CI
    needs: [checks, addons]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require every check to pass
        env:
          REPOSITORY_RESULT: ${{ needs.checks.result }}
          ADDON_RESULT: ${{ needs.addons.result }}
        run: |
          if [[ "$REPOSITORY_RESULT" != success || "$ADDON_RESULT" != success ]]; then
            echo "::error::Repository checks: $REPOSITORY_RESULT; addon tests and packages: $ADDON_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          persist-credentials: false
          fetch-depth: 0 # release tags and history, fetched once for the whole batch
      - name: Plan publication
        id: plan
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/release_plan.py --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.addon }}
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.ci.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - name: Publish the tested package
        env:
          ADDON: ${{ matrix.addon }}
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish.py "$ADDON" --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"

  announce:
    name: Announce release
    needs: [ci, publish]
    # Still runs when no uploads are due, so an interrupted announcement can retry.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.ci.result == 'success' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Announce the completed release on Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${{ vars.DISCORD_ANNOUNCEMENTS_CHANNEL_ID }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/discord_release.py --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
