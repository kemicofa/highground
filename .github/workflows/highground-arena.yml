# Highground Arena: runs addon.yml for addons/HighgroundArena on pull requests and pushes
# to main. On main it publishes a new version as GitHub release HighgroundArena-vX.Y.Z,
# then uploads it to its CurseForge project (CURSEFORGE_TOKEN) and, with an
# X-Wago-ID, to Wago (WAGO_API_KEY).
name: Highground Arena

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  highground-arena:
    name: Highground Arena
    permissions:
      contents: write # the release job creates the GitHub release and tags
    uses: ./.github/workflows/addon.yml
    with:
      addon: HighgroundArena
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
