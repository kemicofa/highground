# Highground Macros: runs addon.yml for addons/HighgroundMacros on pull
# requests and pushes to main. On main it uploads a new version to its
# CurseForge project (the TOC's X-Curse-Project-ID) and tags
# HighgroundMacros-vX.Y.Z. No GitHub release: the repository's CurseForge
# webhook fires on every release and would build Highground. Needs the
# CURSEFORGE_TOKEN secret; without it nothing is published.
name: Highground Macros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  highground-macros:
    name: Highground Macros
    permissions:
      contents: write # the release job creates the tag
    uses: ./.github/workflows/addon.yml
    with:
      addon: HighgroundMacros
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
