# Highground Nearby: runs addon.yml for addons/HighgroundNearby on pull requests and pushes
# to main. On main it uploads a new version to its CurseForge project (the
# TOC's X-Curse-Project-ID; CURSEFORGE_TOKEN secret) and tags
# HighgroundNearby-vX.Y.Z; with an X-Wago-ID, also to Wago (WAGO_API_KEY).
name: Highground Nearby

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  highground-nearby:
    name: Highground Nearby
    permissions:
      contents: write # the release job creates the tag
    uses: ./.github/workflows/addon.yml
    with:
      addon: HighgroundNearby
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
