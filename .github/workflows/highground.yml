# Highground: runs addon.yml for addons/Highground on pull requests and pushes
# to main. On main it publishes a new version as GitHub release vX.Y.Z, then
# uploads the ZIP to CurseForge (CURSEFORGE_TOKEN) and Wago (WAGO_API_KEY).
# Each standalone addon has its own workflow.
name: Highground

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  highground:
    name: Highground
    permissions:
      contents: write # the release job creates the GitHub release
    uses: ./.github/workflows/addon.yml
    with:
      addon: Highground
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
