# Highground: runs addon.yml for addons/Highground on pull requests and pushes
# to main. On main it publishes a new version as GitHub release vX.Y.Z; the
# repository's CurseForge webhook builds the CurseForge file from that release;
# then it uploads the ZIP to Wago Addons (WAGO_API_KEY secret).
# Highground Macros has its own workflow (highground-macros.yml).
name: Highground

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  highground:
    name: Highground
    permissions:
      contents: write # the release job creates the GitHub release
    uses: ./.github/workflows/addon.yml
    with:
      addon: Highground
    secrets:
      WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
