<style>
  #hg-simple-sniper { --hg-marker-size: 52px; }
  #hg-simple-sniper .hg-study { font: 14px/1.4 system-ui, sans-serif; color: light-dark(#202632, #e9edf4); }
  #hg-simple-sniper .hg-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; }
  #hg-simple-sniper .hg-samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  #hg-simple-sniper .hg-sample { min-width: 0; margin: 0; }
  #hg-simple-sniper .hg-sample figcaption { margin-bottom: 6px; }
  #hg-simple-sniper .hg-scene { height: 174px; position: relative; overflow: hidden; isolation: isolate; }
  #hg-simple-sniper .hg-dark { background: linear-gradient(145deg, #152b32 0%, #203e32 36%, #192b34 37%, #111d29 72%, #354438 73%, #263329 100%); }
  #hg-simple-sniper .hg-light { background: linear-gradient(158deg, #c9dce4 0%, #edf2ed 35%, #afc3ca 36%, #dbe6e5 70%, #a9bfc8 71%, #d4e4e3 100%); }
  #hg-simple-sniper .hg-effects { background: radial-gradient(ellipse at 72% 60%, #e3e6ff 0%, #9781dc 10%, transparent 27%), radial-gradient(ellipse at 30% 78%, #f5da99 0%, #b86f3c 14%, transparent 32%), linear-gradient(135deg, #24394b, #51526c 48%, #18333a); }
  #hg-simple-sniper .hg-effects::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(128deg, transparent 32%, #c0e8ef88 33%, transparent 36%, transparent 60%, #b1cff688 61%, transparent 64%); }
  #hg-simple-sniper .hg-player { position: absolute; width: 44px; height: 69px; left: calc(50% - 22px); top: 82px; z-index: 1; }
  #hg-simple-sniper .hg-head { position: absolute; left: 15px; top: 0; width: 14px; height: 16px; border-radius: 6px 6px 3px 3px; background: #566678; box-shadow: inset -4px 0 #293342; }
  #hg-simple-sniper .hg-body { position: absolute; inset: 15px 0 0; background: linear-gradient(90deg, #303c4c 0%, #647389 43%, #354351 57%, #293746 100%); clip-path: polygon(13% 0, 87% 0, 100% 38%, 87% 44%, 74% 27%, 70% 58%, 84% 100%, 58% 100%, 50% 73%, 42% 100%, 16% 100%, 30% 58%, 26% 27%, 13% 44%, 0 38%); }
  #hg-simple-sniper .hg-nameplate { position: absolute; left: calc(50% - 42px); top: 59px; width: 84px; height: 5px; background: #3c242b; border: 1px solid #111820; z-index: 3; }
  #hg-simple-sniper .hg-nameplate::after { content: ''; display: block; width: 67%; height: 100%; background: #da5965; }
  #hg-simple-sniper .hg-marker { position: absolute; width: var(--hg-marker-size); height: var(--hg-marker-size); max-width: none; left: 50%; top: 110px; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; }
  #hg-simple-sniper .hg-pointer .hg-marker { top: 31px; }
  @media (max-width: 450px) { #hg-simple-sniper .hg-samples { grid-template-columns: 1fr; } #hg-simple-sniper .hg-scene { height: 164px; } }
</style>

    tweak.addSlider(state, 'size', { label: 'Icon size', min: 32, max: 64, step: 4, unit: 'px' });
  }
})();
